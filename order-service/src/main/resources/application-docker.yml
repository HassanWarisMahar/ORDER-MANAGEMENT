server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  
  datasource:
    url: jdbc:sqlite:/data/order-service.db
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://api-gateway:8080}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8083}

logging:
  level:
    com.microservices: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  file:
    name: ${LOGGING_FILE_NAME:/logs/app.log}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-characters-long-for-production-use}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Gateway internal access token
gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:gombey-gateway-internal-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
