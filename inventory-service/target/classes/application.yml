server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: inventory-service
  
  datasource:
    url: "jdbc:sqlite:C:\\Users\\hassan.waris\\AppData\\Roaming\\DBeaverData\\workspace6\\.metadata\\sample-database-sqlite-1\\Chinook.db"
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.microservices: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-characters-long-for-production-use}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Gateway internal access token
gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:gombey-gateway-internal-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
