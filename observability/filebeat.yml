filebeat.inputs:
  - type: filestream
    id: microservices-logs
    enabled: true
    paths:
      - /logs/**/*.log

processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~

output.elasticsearch:
  hosts: ["http://opensearch:9200"]
  protocol: "http"

setup.ilm.enabled: false
setup.template.enabled: false
